name: Noticias nacionales

# LAS CORRIDAS PROPIAS DE NACIONALES (nacionales/agenda.py). Desde el 24/10/2026 (v8), todos los días:
#
#   04:00  SOLO WEB: 5 notas de cada categoría (política, economía, sociedad, espectáculos, cine y series,
#          tecnología/IA, mundo y virales), sin redes.
#   22:00  APAGADA desde el 25/10/2026 a pedido del editor (era el carrusel en Instagram y álbum en Facebook con
#          las 10 generales del día para Chivilcoy, a las 23). Para volver: hora 22 en cron-job.org (job 8677866)
#          y el respaldo «20 1 * * *» acá abajo.
#
#   17:35 / 19:45  CORRIDAS PROPIAS DE REELS DE PRUEBA (14/11/2026, nacionales/prueba.py): 5 virales con el video
#          de la nota a las 18:00, 18:25, 18:50, 19:15 y 19:40 (la de las 17:35) y 5 policiales nacionales con video a
#          las 20:00, 20:25, 20:50, 21:15 y 21:40 (la de las 19:45). Cada corrida busca, arma y espera sus turnos.
#          cron-job.org con {"ref":"main","inputs":{"modo":"prueba_virales","origen":"cron"}} y «prueba_policiales».
#          Reemplazan a la fila de las :00 y :30 (modo «ig_prueba», que vivía de lo que sobraba de la de las 4 y de
#          policiales; queda en el código, sin disparo). Respaldo de GitHub a las 17:50 y 19:55 (una sola por día y
#          grupo: la primera que llega toma la corrida).
#
#   10:00  HISTORIA DEL PROGRAMA DE CORRESPONSALES (15/11/2026, reels/historia_corresponsales.py): una pregunta
#          por día sobre imagen IA para que manden su material al WhatsApp del bot. cron-job.org con
#          {"ref":"main","inputs":{"modo":"corresponsales","origen":"cron"}}. Publica SOLO si la dispara
#          cron-job.org (origen=cron) o con publicar=si; a mano, sin eso, la simula.
#
# Los policiales siguen en reels.yml (17 y 20).
#
# QUIÉN DISPARA: cron-job.org a horario exacto, con {"ref":"main","inputs":{"origen":"cron"}}.
# El `schedule:` de abajo es el RESPALDO, 20 minutos después: la primera corrida que llega toma la corrida
# (referencia de git atómica, refs/turnos/<AAAAMMDD-HHMM>/00) y la otra termina sin hacer nada («ya_corrio»).
on:
  schedule:                 # GitHub usa UTC; Argentina es UTC-3 todo el año
    - cron: "20 7 * * *"    # 04:20 Argentina (respaldo de la de las 4, solo web)
    - cron: "50 20 * * *"   # 17:50 Argentina: respaldo de la corrida de reels de prueba de virales (14/11/2026)
    - cron: "55 22 * * *"   # 19:55 Argentina: respaldo de la de policiales
    # (22:20 Argentina —«20 1 * * *», respaldo del carrusel de las 22— la sacó el editor el 25/10/2026: carrusel apagado)
  workflow_dispatch:
    inputs:
      publicar:
        description: '"si" = publicar DE VERDAD. Cualquier otra cosa = solo simular (si la variable PUBLICAR_REDES no está en 1)'
        default: "no"
      origen:
        description: '"manual" o "cron" (la dispara cron-job.org a horario)'
        default: "manual"
      modo:
        description: '"prueba_virales" / "prueba_policiales" = la corrida de 5 reels de prueba (18 y 20). "corresponsales" = la historia de las 10. "ig_prueba" = la fila vieja. Vacío = la agenda'
        default: ""

# Una corrida detrás de la otra: si la anterior sigue publicando, la que sigue espera y arranca sus turnos al terminar.
concurrency:
  group: nacionales
  cancel-in-progress: false

permissions:
  contents: write             # memoria (estado/) y la referencia de la corrida
  issues: write               # el issue de aviso si algo falla

jobs:
  nacionales:
    runs-on: ubuntu-latest
    # La más larga: la de las 4, hasta 40 notas para la web (≈ 1 h); holgura de sobra.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Noticias nacionales
        timeout-minutes: 310
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          # Colab con @diarioyradioagro (reels/colab_agro.py, 27/10/2026): la cuenta de agro acepta al momento.
          AGRO_FACEBOOK_PAGE_ID: ${{ secrets.AGRO_FACEBOOK_PAGE_ID }}
          AGRO_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.AGRO_FACEBOOK_PAGE_ACCESS_TOKEN }}
          AGRO_INSTAGRAM_USER_ID: ${{ secrets.AGRO_INSTAGRAM_USER_ID }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_MEMBER_ID: ${{ secrets.WIX_MEMBER_ID }}
          NOTAS_WEB: ${{ vars.NOTAS_WEB }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAC_FB_POR_PASADA: ${{ vars.NAC_FB_POR_PASADA }}
          NAC_FB_POR_DIA: ${{ vars.NAC_FB_POR_DIA }}
          NAC_INSTAGRAM: ${{ vars.NAC_INSTAGRAM }}
          # Reels de PRUEBA (fila del 12/11/2026): virales a la fila (11), los de Instagram por día (11) y la franja.
          # La de las 4 ya no deja virales para la fila de prueba (14/11/2026): las busca la corrida de las 17:35.
          NAC_IG_PRUEBA_VIRALES: ${{ vars.NAC_IG_PRUEBA_VIRALES || '0' }}
          NAC_PRUEBA_CUANTOS: ${{ vars.NAC_PRUEBA_CUANTOS }}
          NAC_PRUEBA_PASO_MIN: ${{ vars.NAC_PRUEBA_PASO_MIN }}
          NAC_PRUEBA_VIRALES_HORA: ${{ vars.NAC_PRUEBA_VIRALES_HORA }}
          NAC_PRUEBA_POLICIALES_HORA: ${{ vars.NAC_PRUEBA_POLICIALES_HORA }}
          IG_PRUEBA_POR_DIA: ${{ vars.IG_PRUEBA_POR_DIA }}
          NAC_IG_PRUEBA_HORA: ${{ vars.NAC_IG_PRUEBA_HORA }}
          NAC_IG_PRUEBA_VIRALES_FIN: ${{ vars.NAC_IG_PRUEBA_VIRALES_FIN }}
          NAC_IG_PRUEBA_POL_HORA: ${{ vars.NAC_IG_PRUEBA_POL_HORA }}
          NAC_IG_PRUEBA_FIN: ${{ vars.NAC_IG_PRUEBA_FIN }}
          VIDEO_CONTROL: ${{ vars.VIDEO_CONTROL }}
          NAC_MINUTOS: ${{ vars.NAC_MINUTOS }}
          NAC_MINUTOS_FINDE: ${{ vars.NAC_MINUTOS_FINDE }}
          NAC_CARRUSEL_FB: ${{ vars.NAC_CARRUSEL_FB }}
          NAC_CARRUSEL_NOTAS: ${{ vars.NAC_CARRUSEL_NOTAS }}
          # Los cupos que se comparten con policiales y el bot del diario.
          IG_RESERVA_BOT: ${{ vars.IG_RESERVA_BOT }}
          YT_SHORTS_POR_DIA: ${{ vars.YT_SHORTS_POR_DIA }}
          PUBLICAR_VAR: ${{ vars.PUBLICAR_REDES }}
          PUBLICAR_INPUT: ${{ github.event.inputs.publicar }}
          MODO_INPUT: ${{ github.event.inputs.modo }}
          ORIGEN_INPUT: ${{ github.event.inputs.origen }}
          # La historia de corresponsales: imagen IA de Cloudflare (los mismos secrets que agro).
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HIST_CORRESPONSALES: ${{ vars.HIST_CORRESPONSALES }}
          HIST_CORRESPONSALES_REEL: ${{ vars.HIST_CORRESPONSALES_REEL }}
          CRON_GH: ${{ github.event.schedule }}
          NACIONALES_VAR: ${{ vars.NACIONALES }}
        run: |
          set -o pipefail      # sin esto, el `| tee` se come la falla y la corrida no avisa
          if [ "$MODO_INPUT" = "corresponsales" ]; then
            CARGS=""
            if [ "$ORIGEN_INPUT" = "cron" ] || [ "$PUBLICAR_INPUT" = "si" ]; then CARGS="--publicar"; fi
            python -m reels.historia_corresponsales $CARGS | tee informe_nacionales.md
            exit 0
          fi
          # Las corridas propias de reels de prueba (14/11/2026): cron-job.org a las 17:35 y 19:45, respaldos 17:50 y 19:55.
          GRUPO=""
          if [ "$MODO_INPUT" = "prueba_virales" ] || [ "$CRON_GH" = "50 20 * * *" ]; then GRUPO="virales"; fi
          if [ "$MODO_INPUT" = "prueba_policiales" ] || [ "$CRON_GH" = "55 22 * * *" ]; then GRUPO="policiales"; fi
          if [ -n "$GRUPO" ]; then
            PARGS="--grupo $GRUPO"
            if { [ "$PUBLICAR_VAR" = "1" ] || [ "$PUBLICAR_INPUT" = "si" ]; } && [ "$NACIONALES_VAR" != "0" ]; then
              PARGS="$PARGS --publicar"
            fi
            python -m nacionales.prueba $PARGS | tee informe_nacionales.md
            exit 0
          fi
          ARGS="--agenda"
          # La fila de reels de prueba (12/11/2026; franjas del 14/11/2026): cron-job.org a las :00 y :30 de 18 a 22
          # y los respaldos de GitHub. Si el turno ya tiene su reel, termina sin hacer nada.
          if [ "$MODO_INPUT" = "ig_prueba" ]; then
            ARGS="--ig-prueba"
          fi
          if { [ "$PUBLICAR_VAR" = "1" ] || [ "$PUBLICAR_INPUT" = "si" ]; } && [ "$NACIONALES_VAR" != "0" ]; then
            ARGS="$ARGS --publicar"
          fi
          python -m nacionales.pasada $ARGS | tee informe_nacionales.md

      - name: Guardar las piezas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nacionales-${{ github.run_number }}
          path: |
            salida_nacionales/**/*.mp4
            salida_nacionales/**/*.jpg
            salida_nacionales/**/*.json
          retention-days: 1
          compression-level: 0

      - name: Recordar qué nacionales ya salieron
        # Solo los archivos de nacionales: tools/guardar_estado.py los combina con lo que guardó policiales.
        if: always()
        run: |
          if [ -z "$(git status --porcelain estado/nacionales.json estado/tema_reels.json estado/buzon_distribuidor.json estado/auditoria.json estado/publicados.json)" ]; then
            echo "La memoria de nacionales no cambió."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # publicados.json: la fila de reels de prueba anota ahí los policiales que publica (12/11/2026).
          python tools/guardar_estado.py --solo nacionales.json tema_reels.json buzon_distribuidor.json auditoria.json publicados.json

      - name: Avisar en un issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="Las noticias nacionales fallaron"
          CUERPO="$( [ -f informe_nacionales.md ] && cat informe_nacionales.md || echo 'La corrida falló antes del informe.')"
          CUERPO="$(printf '%s\n\n[Ver la corrida](%s)' "$CUERPO" "$CORRIDA")"
          EXISTENTE="$(gh issue list --state open --search "$TITULO" --json number,title \
            --jq ".[] | select(.title == \"$TITULO\") | .number" | head -1)"
          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --body "$CUERPO"
          else
            gh issue create --title "$TITULO" --body "$CUERPO"
          fi
