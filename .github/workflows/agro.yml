name: Agro (@diarioyradioagro)

# 23/10/2026: a las 05:00, el REEL DE DATOS (agro/reel_datos.py): las placas de clima, alertas, granos, dólar
# y Chicago en 4:5, 5 s cada una, en @diarioyradioagro con @diarioyradio de colaborador (y en las dos
# páginas de Facebook). Las historias de datos también se copian en @diarioyradio.
#
# 20/10/2026 (pedido del editor): cada corrida publica 5 REELS, uno cada 20 minutos, cada uno de un sitio
# distinto (30 por día, sin carruseles): 07:00-08:20, 10:00-11:20, 13:00-14:20, 16:00-17:20, 18:00-19:20 y
# 21:00-22:20; las historias, igual (07:00, 14:00, 19:00). La corrida dura ~90 min. Lo de abajo es la historia.
#
# Activado por el editor el 14/10/2026 con 3 reels por día. Desde el 19/10/2026 (pedido del editor): 6 CORRIDAS
# por día (7, 10, 13, 16, 18 y 21 h); cada una lee todas las fuentes, arma y publica 1 REEL y, una hora
# después, 1 CARRUSEL (reel y carrusel intercalados todo el día). Las historias, en sus horarios de siempre
# dentro de la corrida que los contiene (agro/agenda.py; variables del repo AGRO_AGENDA y AGRO_CORRIDAS):
#
#   07:00 historias «El campo hoy» + reel   08:00 carrusel
#   10:00 reel   11:00 carrusel
#   13:00 reel   14:00 carrusel + historias (mapa de lluvias, Chicago, la novedad)
#   16:00 reel   17:00 carrusel
#   18:00 reel   19:00 carrusel + historias «Así cerró el mercado»
#   21:00 reel   22:00 carrusel
#
# La corrida ESPERA dentro de la máquina el horario de su segundo posteo (por eso dura ~70 min). Entre
# posteo y posteo sube la memoria al repo, así un corte no repite lo publicado.
#
# Reel y carrusel: lee las fuentes, descarta duplicados, puntúa con IA, elige la mejor nota que no salió
# y arma textos, imagen (foto oficial con crédito, foto de medio RECREADA con IA, o IA; nunca el logo
# suelto) y el reel 4:5 o el carrusel «deslizá e informate». Historias: datos de granos (Cámara Arbitral
# de Rosario), dólar (BCRA y Banco Nación), Chicago y clima (SMN), sin IA. Publica con las credenciales
# AGRO_* (salvaguarda: nunca las del diario). Detalle: agro/pasada.py y agro/publicar.py.
#
# Quién dispara: cron-job.org a horario exacto con {"ref":"main","inputs":{"origen":"cron"}}. El
# `schedule:` de abajo es el RESPALDO, 20 minutos después: si ese horario ya publicó, la memoria
# (estado/agro.json) lo frena y no hace nada.
#
# Publica si la variable del repo AGRO_PUBLICAR es 1. Para apagar SOLO esto: AGRO_PUBLICAR=0 (sigue
# armando y simula; las piezas quedan como artefacto de la corrida).
on:
  schedule:                 # UTC; Argentina es UTC-3 todo el año. Respaldo 20 min después de cada corrida.
    - cron: "20 8 * * *"    # 05:20 (el reel de datos, 23/10/2026)
    - cron: "20 10 * * *"   # 07:20
    - cron: "20 13 * * *"   # 10:20
    - cron: "20 16 * * *"   # 13:20
    - cron: "20 19 * * *"   # 16:20
    - cron: "20 21 * * *"   # 18:20
    - cron: "20 0 * * *"    # 21:20
  workflow_dispatch:
    inputs:
      publicar:
        description: '"si" publica aunque AGRO_PUBLICAR no esté en 1; "no" solo simula'
        default: ""
      origen:
        description: "quién la dispara (cron = cron-job.org)"
        default: "manual"
      tipo:
        description: '"reel", "carrusel", "historias" o "numeros" (Los números de la semana): para simular, o para publicar fuera de horario (vacío = lo que toca a esta hora)'
        default: ""
      fuera_de_cupo:
        description: '"si" + publicar "si" + tipo: publica YA, fuera de la agenda (recuperar un horario que no salió)'
        default: ""

# Grupo propio: no hace fila detrás de policiales y dos disparos juntos no publican dos veces.
concurrency:
  group: agro
  cancel-in-progress: false

permissions:
  contents: write             # para commitear estado/agro.json (y subir el video al Release temporal)
  issues: write               # para avisar si falla

jobs:
  agro:
    runs-on: ubuntu-latest
    timeout-minutes: 170      # la corrida espera sus 5 reels (~90 min; hasta ~130 si arrancó tarde)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pasada agro
        timeout-minutes: 150
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          AGRO_FACEBOOK_PAGE_ID: ${{ secrets.AGRO_FACEBOOK_PAGE_ID }}
          AGRO_FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.AGRO_FACEBOOK_PAGE_ACCESS_TOKEN }}
          AGRO_INSTAGRAM_USER_ID: ${{ secrets.AGRO_INSTAGRAM_USER_ID }}
          # Las del diario: para que la salvaguarda compare y, desde el 23/10/2026, para copiar las historias
          # de datos en @diarioyradio, aceptar la colab del reel de datos y su reel en la página del diario
          # (agro/publicar.py, credenciales_diario: tienen que ser las de @diarioyradio).
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_RESERVA_BOT: ${{ vars.IG_RESERVA_BOT }}
          AGRO_HISTORIAS_DIARIO: ${{ vars.AGRO_HISTORIAS_DIARIO }}
          AGRO_REEL_DATOS: ${{ vars.AGRO_REEL_DATOS }}
          AGRO_REEL_DATOS_FB_DIARIO: ${{ vars.AGRO_REEL_DATOS_FB_DIARIO }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_MEMBER_ID: ${{ secrets.WIX_MEMBER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGRO_MAX_DIA: ${{ vars.AGRO_MAX_DIA }}
          AGRO_POR_PASADA: ${{ vars.AGRO_POR_PASADA }}
          AGRO_AGENDA: ${{ vars.AGRO_AGENDA }}
          AGRO_CORRIDAS: ${{ vars.AGRO_CORRIDAS }}
          AGRO_POR_CORRIDA: ${{ vars.AGRO_POR_CORRIDA }}
          AGRO_INTERVALO_MIN: ${{ vars.AGRO_INTERVALO_MIN }}
          AGRO_UN_SITIO_POR_CORRIDA: ${{ vars.AGRO_UN_SITIO_POR_CORRIDA }}
          AGRO_REVISION_SENSIBLE: ${{ vars.AGRO_REVISION_SENSIBLE }}
          AGRO_SCORE_MIN: ${{ vars.AGRO_SCORE_MIN }}
          PUBLICAR_VAR: ${{ vars.AGRO_PUBLICAR }}
          PUBLICAR_INPUT: ${{ github.event.inputs.publicar }}
          TIPO_INPUT: ${{ github.event.inputs.tipo }}
          FUERA_INPUT: ${{ github.event.inputs.fuera_de_cupo }}
        run: |
          set -o pipefail      # sin esto, el `| tee` se come la falla y la corrida no avisa
          ARGS=""
          if { [ "$PUBLICAR_VAR" = "1" ] || [ "$PUBLICAR_INPUT" = "si" ]; } && [ "$PUBLICAR_INPUT" != "no" ]; then
            ARGS="--publicar"
            if [ "$FUERA_INPUT" = "si" ] && [ -n "$TIPO_INPUT" ]; then
              ARGS="--publicar --fuera-de-cupo --tipo $TIPO_INPUT"
            fi
          elif [ -n "$TIPO_INPUT" ]; then
            ARGS="--tipo $TIPO_INPUT"
          fi
          echo "python -m agro.pasada $ARGS"
          python -m agro.pasada $ARGS | tee informe_agro.md

      - name: Guardar la pieza
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agro-${{ github.run_number }}
          path: |
            salida_agro/**/*.mp4
            salida_agro/**/*.jpg
            salida_agro/**/*.json
            salida_agro/**/*.html
          retention-days: 2
          compression-level: 0

      - name: Recordar qué salió
        # SOLO estado/agro.json: tools/guardar_estado.py lo combina con la copia que guardan los
        # trabajos de policiales (combinar_agro), así nadie pisa lo publicado.
        if: always()
        run: |
          if [ -z "$(git status --porcelain estado/agro.json)" ]; then
            echo "La memoria de agro no cambió."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/guardar_estado.py --solo agro.json

      - name: Avisar en un issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="La pasada de agro falló"
          CUERPO="$( [ -f informe_agro.md ] && tail -60 informe_agro.md || echo 'La corrida falló antes del informe.')"
          CUERPO="$(printf '%s\n\n[Ver la corrida](%s)' "$CUERPO" "$CORRIDA")"
          EXISTENTE="$(gh issue list --state open --search "$TITULO" --json number,title \
            --jq ".[] | select(.title == \"$TITULO\") | .number" | head -1)"
          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --body "$CUERPO"
          else
            gh issue create --title "$TITULO" --body "$CUERPO"
          fi
