name: Reels de policiales

# Las 3 pasadas del día. GitHub Actions usa UTC y Argentina es UTC-3.
#
# Corre acá y no en Railway porque acá es GRATIS: en repos PÚBLICOS los minutos son
# ilimitados. Cada pasada tarda ~3 minutos. Es el mismo lugar donde ya corre el bot de
# corresponsales, así que es una plataforma menos que mantener.
#
# ⚠️ El scraper corre SIN clasificador de IA, que es su default desde que se invirtió el
# flag. Encenderlo costaría ~US$41/mes y además está frenado por la cláusula de
# scraper/run.py (pide la variable CLASIFICADOR_IA_AUTORIZADO). La IA que SÍ se usa es la
# de los guiones, con el cupo gratis de Gemini.

# ✅ AUTOMATIZACION ENCENDIDA A PEDIDO DEL EDITOR (27/09/2026), despues de la primera
# publicacion real de prueba (1 reel: salio bien en Instagram, Facebook y YouTube).
# Estuvo apagada del 22/09 al 27/09 mientras se evaluaban los reels.
#
# SIN TOPE de reels por pueblo ni por dia (decision del editor, 27/09): cada pasada hace
# reel de TODAS las notas nuevas que sirvan (--cuantos 0). Queda afuera solo lo que no
# tiene foto, lo que no es policial y el mismo hecho contado dos veces.
#
# HORARIOS (27/09), elegidos cruzando dos mediciones:
#   - cuando PUBLICAN los medios: 227 notas de una semana → fuerte de 7 a 11, parejo de 13
#     a 19 (pico a las 17) y un 15% despues de las 20, que con las 3 pasadas viejas (10,
#     17 y 20) se perdia entero: cada pasada toma solo lo de HOY.
#   - cuando esta CONECTADO el publico de @diarioyradio (insights de Instagram): alto de
#     10 a 23, picos 12-13 y 19-22; despues de medianoche cae a la mitad.
# Pasadas cada 3 horas = tandas chicas y reels frescos repartidos en el dia, en vez de
# rafagas. La de las 23:35 rescata lo de la noche. A las :05 y no en punto porque GitHub
# atrasa los cron de la hora en punto (es cuando mas cargado esta).
#
# Para APAGAR la publicacion sin tocar codigo: borrar la variable PUBLICAR_REDES (o
# ponerla en 0) en Settings → Secrets and variables → Actions → Variables. Las pasadas
# siguen armando reels pero solo simulan. Para apagar todo: comentar el `schedule:`.
#
# QUIÉN DISPARA LAS PASADAS (27/09): cron-job.org, a horario exacto, igual que el bot del
# diario. El `schedule:` de GitHub es un solo programador para todo GitHub y en horas de
# carga atrasa o DESCARTA corridas: el 27/09 la de las 09:05 nunca se creó, y el 22/09 la
# primera salió 4 h tarde. Queda abajo como RESPALDO: si llegan a correr las dos, la
# segunda no repite nada (memoria de notas y de publicados).
# cron-job.org llama a la API workflow_dispatch con {"ref":"main","inputs":{"origen":"cron"}}
# y el token fino «cron-job publicador» (cuenta dlcchivilcoy, Actions RW en social_publisher
# y policiales-bsas; vence 9/6/2027).
on:
  schedule:                 # GitHub usa UTC; Argentina es UTC-3 todo el año
    - cron: "5 12 * * *"    # 09:05 Argentina
    - cron: "5 15 * * *"    # 12:05 Argentina
    - cron: "5 18 * * *"    # 15:05 Argentina
    - cron: "5 21 * * *"    # 18:05 Argentina
    - cron: "5 0 * * *"     # 21:05 Argentina
    - cron: "35 2 * * *"    # 23:35 Argentina
  workflow_dispatch:
    inputs:
      cuantos:
        description: "Cuántos reels generar (0 = todas las notas que sirvan)"
        default: "0"
      ventana:
        description: '"hoy" (lo que corre siempre) o un número de horas, para probar'
        default: "hoy"
      publicar:
        description: '"si" = publicar DE VERDAD (Instagram como reel de prueba, Facebook normal, YouTube Short). Cualquier otra cosa = solo simular'
        default: "no"
      origen:
        # cron-job.org manda "cron": es una pasada de horario, no una prueba a mano, y el
        # chequeo del motor (2 min) no tiene sentido repetirlo seis veces por día.
        description: '"manual" (corrida a mano) o "cron" (la dispara cron-job.org a horario)'
        default: "manual"

# Dos corridas a la vez se pisarían el ledger y podrían repetir una nota.
concurrency:
  group: reels-policiales
  cancel-in-progress: false   # NO cancelar: una corrida a medias deja el ledger sin escribir

permissions:
  contents: write             # para commitear el ledger de vuelta al repo
  issues: write               # para abrir el issue de aviso cuando algo falla

jobs:
  generar:
    runs-on: ubuntu-latest
    # Era 20, después 60. Sin tope de reels (27/09) una pasada puede traer 20 o más, y
    # salen escalonados a 5 minutos: 30 son dos horas y media de publicación. OJO: una
    # nota queda anotada como hecha cuando se ARMA su reel, así que si el tiempo corta
    # la publicación, lo que faltaba no vuelve a salir: por eso el tope es holgado. El
    # paso de publicar tiene el suyo (300) por debajo de este, para que si se cuelga
    # todavía corran los pasos que guardan la memoria y avisan.
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4
        with:
          # La punta de la rama AL ARRANCAR, no el commit del momento del disparo. Una
          # pasada que esperó en la fila (27/09: 1 h 20 min detrás de una colgada) si no
          # arranca con la memoria VIEJA y no ve lo que publicó la anterior.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # sin esto, instalar dependencias son ~90 s POR CORRIDA

      - name: Instalar dependencias
        run: pip install -r requirements.txt
        # ffmpeg NO se instala por apt: viene adentro de imageio-ffmpeg, con la versión
        # fijada. Es a propósito — apt a veces se cuelga y tumba la corrida entera.

      - name: Chequear el motor de reels del bot (solo en corridas a mano)
        # El motor (estetica_bot/) se prueba en Windows, pero acá corre el ffmpeg de LINUX
        # que trae imageio-ffmpeg: es otro binario y ya pasó que le faltara un filtro. Esto
        # corre el autochequeo del propio bot. ~2 min; en las pasadas automáticas no se
        # repite, alcanza con la primera a mano después de traer una estética nueva.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.origen != 'cron'
        run: python tools/test_estetica.py

      - name: Traer las noticias
        # "hoy" es el día calendario argentino. Cada pasada trae SOLO lo del día: no se
        # arrastra nada de ayer, aunque el medio lo haya publicado hace 20 horas.
        # Tarda de 1 a 8 minutos. El 27/09 quedó 3 h 18 min colgado esperando a un medio y
        # trabó la fila de las pasadas siguientes: con este tope, en el peor caso se pierde
        # UNA pasada y la siguiente sale a horario. PYTHONUNBUFFERED: que el log muestre
        # cada medio en el momento (si no, Python lo guarda y un cuelgue no deja rastro).
        timeout-minutes: 20
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m scraper.run --sin-navegador \
            --ventana "${{ github.event.inputs.ventana || 'hoy' }}"

      - name: Armar los reels
        env:
          # Pool de claves de Gemini: cada una es de un proyecto distinto de Google AI
          # Studio y tiene su PROPIO cupo gratis. reels/ia.py rota entre ellas ante un 429.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          # Respaldo pago, solo si se agotaron todas las gratis. Puede quedar vacío.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # --cadencia le pone hora a cada pieza, una cada 5 minutos: la lee el publicador.
        run: |
          python -m reels.flujo --con-ia --cadencia \
            --cuantos "${{ github.event.inputs.cuantos || '0' }}"

      # ─────────────────────────────────────────────────────────────────────────
      # PUBLICAR: Instagram como REEL DE PRUEBA (el que anda pasa solo al feed),
      # Facebook como reel NORMAL y YouTube como SHORT en Radio del Centro. Decidido el
      # 26/09/2026. Sin tope propio (27/09), pero Instagram (100 posteos cada 24 h por
      # cuenta) y YouTube (100 subidas por día por proyecto) se COMPARTEN con el bot del
      # diario: policiales frena antes para no dejarlo sin lugar. Reservas: variables del
      # repo IG_RESERVA_BOT (25 si no está) y YT_SHORTS_POR_DIA (80 si no está).
      #
      # Instagram de PRUEBA (27/09): los más nuevos de cada pasada, salteando hechos que ya
      # estén en la cuenta. Cuántos, según el horario: 2 a las 12:05, 18:05 y 21:05 y 1 en
      # las otras = 9 por día (IG_PRUEBA_POR_HORARIO en reels/publicador.py). El tope de la
      # API no está documentado (el 27/09 rebotó con 11-13 en 24 h). La variable del repo
      # IG_PRUEBA_POR_PASADA, si se carga, pisa el horario con un número fijo.
      #
      # NOTA EN LA WEB (27/09): cada reel tiene su nota en la sección «Región» de la web
      # (fuera de la portada) y el posteo de Facebook lleva su link. Orden por pieza:
      # YouTube → nota (con el Short adentro) → Facebook → Instagram. Se apaga con la
      # variable NOTAS_WEB=0. Credenciales de Wix = las del bot del diario.
      #
      # TikTok: DESACTIVADO hasta que aprueben el Direct Post, ni borradores. Sus claves
      # están cargadas como secrets pero A PROPÓSITO no se le pasan a ningún paso.
      #
      # APAGADO por defecto. Publica de verdad solo si:
      #   - alguien corre el workflow a mano con publicar = "si", o
      #   - la variable del repo PUBLICAR_REDES vale 1 (Settings → Secrets and
      #     variables → Actions → Variables). Es el interruptor de las pasadas
      #     automáticas: se prende y se apaga sin tocar código.
      # Si no, el paso de abajo SIMULA: muestra qué saldría, sin tocar ninguna red.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Publicar en Instagram (prueba), Facebook y YouTube
        if: vars.PUBLICAR_REDES == '1' || github.event.inputs.publicar == 'si'
        timeout-minutes: 300
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_RESERVA_BOT: ${{ vars.IG_RESERVA_BOT }}
          IG_PRUEBA_POR_PASADA: ${{ vars.IG_PRUEBA_POR_PASADA }}
          # Facebook admite 30 reels por día POR PÁGINA y la comparte con el bot: 2 por pasada.
          FB_POR_PASADA: ${{ vars.FB_POR_PASADA }}
          # La nota de la web (reels/web.py): Wix del diario.
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_MEMBER_ID: ${{ secrets.WIX_MEMBER_ID }}
          NOTAS_WEB: ${{ vars.NOTAS_WEB }}
          # Canal RADIO DEL CENTRO. El publicador verifica el canal antes de subir.
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_SHORTS_POR_DIA: ${{ vars.YT_SHORTS_POR_DIA }}
          # Para subir el .mp4 al Release: Instagram no recibe el archivo, lo va a buscar
          # a una URL pública. Lo da GitHub solo (contents: write, más arriba).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m reels.publicador --publicar

      - name: Simular la publicación (no se publica nada)
        if: vars.PUBLICAR_REDES != '1' && github.event.inputs.publicar != 'si'
        run: python -m reels.publicador

      - name: Guardar los reels
        uses: actions/upload-artifact@v4
        if: always()           # aunque algo falle, subir lo que se haya armado
        with:
          name: reels-${{ github.run_number }}
          path: |
            salida_reels/**/*.mp4
            salida_reels/**/*.jpg
            salida_reels/**/*.json
          # ⬇️ El borrado diario, sin una línea de código: GitHub lo hace solo.
          retention-days: 1
          compression-level: 0  # los .mp4 ya están comprimidos; recomprimir es tiempo tirado

      # ─────────────────────────────────────────────────────────────────────────
      # El aviso cuando algo se rompe, sin pagar nada.
      #
      # salud.py termina en error si encuentra una falla. Eso hace fallar la corrida,
      # y GitHub manda el mail de "workflow failed" por su cuenta: no hace falta un
      # servicio de mail, ni un webhook, ni un secreto más. El paso siguiente agrega
      # el detalle en un issue del repo, que también llega por mail.
      #
      # Va ANTES del commit del ledger a propósito, para que estado/salud.json —donde
      # lleva la cuenta de cuántas pasadas seguidas falla cada medio— quede guardado
      # en el mismo commit. Sin eso, la cuenta arrancaría de cero cada pasada y un
      # medio muerto no se detectaría nunca.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Revisar cómo salió la pasada
        id: salud
        if: always()
        run: python -m salud

      - name: Recordar qué notas ya salieron
        # El ledger es lo ÚNICO que tiene que sobrevivir entre pasadas. Como cada corrida
        # arranca en una máquina vacía, se commitea de vuelta al repo: es lo más simple que
        # funciona y además queda auditable en el historial. Se poda solo a los 5 días.
        # [skip ci] para no disparar otros workflows con este commit.
        #
        # if: always() y no success(): si la pasada se marcó como fallada porque salud.py
        # encontró un problema, los reels que SÍ se hicieron ya existen, y no anotarlos
        # haría que la pasada siguiente los repita. Ese era justo el problema a evitar.
        if: always()
        run: |
          if [ -z "$(git status --porcelain estado/)" ]; then
            echo "El ledger no cambió (no se hizo ningún reel nuevo)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Combina con lo que haya subido otra pasada en vez de pelearse con git. Antes era
          # `git pull --rebase` y el 27/09 chocó en salud.json: la memoria de 16 posteos se
          # perdió y la pasada siguiente iba a repetirlos (ver tools/guardar_estado.py).
          python tools/guardar_estado.py

      - name: Avisar en un issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub lo da solo: no hay que cargarlo
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="Los reels de policiales fallaron"
          # Un issue y no uno por pasada: si el problema dura tres días, son 9 corridas
          # fallidas y 9 issues idénticos que no aportan nada. Se comenta el que ya está
          # abierto, que además deja ver desde cuándo viene pasando.
          if [ -f informe_salud.md ]; then
            CUERPO="$(cat informe_salud.md)"
          else
            CUERPO="La corrida falló antes de llegar a la revisión: el informe no se generó."
          fi
          # Lo que no salió en Instagram o Facebook (lo escribe reels/publicador.py).
          if [ -f informe_publicacion.md ]; then
            CUERPO="$(printf '%s\n\n%s' "$CUERPO" "$(cat informe_publicacion.md)")"
          fi
          CUERPO="$(printf '%s\n\n[Ver la corrida](%s)' "$CUERPO" "$CORRIDA")"

          EXISTENTE="$(gh issue list --state open --search "$TITULO" --json number,title \
            --jq ".[] | select(.title == \"$TITULO\") | .number" | head -1)"

          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --body "$CUERPO"
            echo "Comentado en el issue #$EXISTENTE"
          else
            gh issue create --title "$TITULO" --body "$CUERPO"
          fi

      - name: Qué se generó
        if: always()
        run: |
          echo "### Reels de esta pasada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import glob, json
          hubo = False
          for ruta in sorted(glob.glob("salida_reels/*/[0-9]*.json")):
              hubo = True
              d = json.load(open(ruta, encoding="utf-8"))
              g = d["guion"]
              apto = "OK" if d.get("apto_para_publicar") else "NO PUBLICABLE"
              print(f"**{d['localidad']}** — {g['titular']}  ")
              print(f"_{g['volanta']}_ · {d['tipo']} · {apto} · via `{g['via']}`  ")
              print("")
          if not hubo:
              print("_No se generó ningún reel en esta pasada._")
          PY
